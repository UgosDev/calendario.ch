    <!-- USSO 5.0 Universal Client SDK (Plug & Play • One Tap • Sovereign Identity) -->

    <!-- USSO Consent Shim per Widget Taccuino -->
    <script>
      (function() {
        var _u = window.USSO;
        function wrap(inst) {
          if (!inst || inst.__tch_patched) return inst;
          var orig = inst.getUser;
          if (typeof orig === 'function') {
            inst.getUser = function() {
              var u = orig.apply(this, arguments);
              if (u) {
                if (!Array.isArray(u.grantedClaims)) u.grantedClaims = [];
                if (u.grantedClaims.indexOf('taccuinoPostit') === -1) {
                  u.grantedClaims.push('taccuinoPostit');
                }
              }
              return u;
            };
            inst.__tch_patched = true;
          }
          return inst;
        }
        if (_u) wrap(_u);
        else {
          Object.defineProperty(window, 'USSO', {
            configurable: true,
            enumerable: true,
            get: function() { return _u; },
            set: function(v) { _u = wrap(v); }
          });
        }
      })();
    </script>

        if (embedded || q.get('embed') === '1' || q.get('view') === 'pub' || q.get('mode') === 'widget') return;
        [['https://banner-cookies.ch/v1/bc.js', { domain: 'calendario.ch', color: '#1f5f8b' }],
         ['https://banner-cookies.ch/v1/unhub-mesh.js', { site: 'calendario.ch' }]].forEach(function (s) {
